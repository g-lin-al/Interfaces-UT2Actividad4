<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarea 2</title>
    <link rel="stylesheet" href="style2.css" />
</head>
<body>
    <header>
        <div id="header_img">
            <img src="../imagenes/turismo_grancanaria.jpg" alt="imagen header" id="logo" />
        </div>
        <div id="header_bloque">
            <h1>Descubre Vegueta</h1>
            <p>A través de la opacidad</p>
        </div>
    </header>
    <main>
        <section id="fotos">
            <div class="foto_opacidad">
                <img src="/imagenes/vegueta.jpg" alt="foto_1" id="foto_1" />
                <figcaption>Opacidad 30%</figcaption>
            </div>
            <div class="foto_opacidad">
                <img src="/imagenes/vegueta.jpg" alt="foto_2" id="foto_2" />
                <figcaption>Opacidad 60%</figcaption>
            </div>
            <div class="foto_opacidad">
                <img src="/imagenes/vegueta.jpg" alt="foto_3" id="foto_3" />
                <figcaption>Opacidad 85%</figcaption>
            </div>
        </section>
    </main>
</body>
</html>
